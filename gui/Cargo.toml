[package]
name = "gui"
version = "0.1.0"
edition = "2021"

[dependencies]
catalog = { path = "../crates/catalog" }
leptos = { version = "0.8", features = ["ssr"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
