[package]
name = "consumer"
version = "0.1.0"
edition = "2021"

[lib]
name = "consumer"
path = "src/lib.rs"

[[bin]]
name = "consumer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
catalog = { path = "../crates/catalog" }

[build-dependencies]
tonic-build = "0.12"