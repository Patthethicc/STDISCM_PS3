[package]
name = "producer"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "time", "net"] }
tokio-stream = "0.1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
